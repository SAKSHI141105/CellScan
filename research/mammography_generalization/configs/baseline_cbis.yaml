# Control condition: identical backbone/classifier head as lesion_guided_cbis.yaml,
# but lesion_loss_weight=0 disables the segmentation-supervision branch entirely
# (the decoder head still exists in the graph so parameter counts stay comparable,
# it just never contributes gradient — see src/training/losses.py).
experiment_name: baseline_resnet50_cbis

data:
  train_csv: data/processed/cbis_ddsm/train.csv
  val_csv: data/processed/cbis_ddsm/val.csv
  image_root: data/processed/cbis_ddsm/images
  mask_root: data/processed/cbis_ddsm/masks
  image_size: 512
  # CBIS-DDSM is scanned film, mostly MONOCHROME2 already, but a few source
  # DICOMs come through as MONOCHROME1 (inverted) — dataset.py normalizes both
  invert_monochrome1: true
  apply_voi_lut: true
  batch_size: 16
  num_workers: 4

model:
  backbone: resnet50          # anything timm knows: resnet50, efficientnet_b0, vit_small_patch16_224, ...
  pretrained: true
  in_channels: 1               # mammograms are single-channel; backbone.py replicates to 3ch for imagenet weights
  num_classes: 1                # binary malignant/benign, sigmoid output

training:
  epochs: 40
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_epochs: 2
  early_stopping_patience: 8
  lesion_loss_weight: 0.0       # <- the only structural difference from lesion_guided_cbis.yaml
  seed: 42

output:
  checkpoint_dir: outputs/baseline_resnet50_cbis/checkpoints
  log_dir: outputs/baseline_resnet50_cbis/logs
