# Same backbone/data/optimizer as baseline_cbis.yaml — the comparison only
# means something if everything except the auxiliary loss is held fixed.
experiment_name: lesion_guided_resnet50_cbis

data:
  train_csv: data/processed/cbis_ddsm/train.csv
  val_csv: data/processed/cbis_ddsm/val.csv
  image_root: data/processed/cbis_ddsm/images
  mask_root: data/processed/cbis_ddsm/masks
  image_size: 512
  invert_monochrome1: true
  apply_voi_lut: true
  batch_size: 16
  num_workers: 4

model:
  backbone: resnet50
  pretrained: true
  in_channels: 1
  num_classes: 1
  decoder_channels: [256, 128, 64, 32]   # U-Net decoder stage widths, deepest -> shallowest

training:
  epochs: 40
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  warmup_epochs: 2
  early_stopping_patience: 8
  # TODO: 0.5 was picked from a quick sweep over {0.1, 0.3, 0.5, 1.0} on a
  # held-out slice of CBIS train — worth re-sweeping per-dataset if the mask
  # coverage ratio (fraction of train samples with a lesion mask) changes a lot
  lesion_loss_weight: 0.5
  lesion_loss_type: dice_bce    # dice | bce | dice_bce
  seed: 42

output:
  checkpoint_dir: outputs/lesion_guided_resnet50_cbis/checkpoints
  log_dir: outputs/lesion_guided_resnet50_cbis/logs
